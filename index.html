<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>FreeForge — Free Minecraft Server Hosting</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"> <style> .form-group{margin-bottom:16px} .form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text2)} .form-input{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;transition:var(--transition)} .form-input:focus{border-color:var(--border2);box-shadow:0 0 0 3px rgba(0,255,136,0.1)} </style> <style> :root{--bg:#0a0a0f;--bg2:#0f0f1a;--bg3:#141428;--bg4:#1a1a35;--green:#00ff88;--cyan:#00d4ff;--purple:#7c3aed;--red:#ff4444;--yellow:#ffcc00;--text:#e8e8f0;--text2:#9999bb;--text3:#5555aa;--border:rgba(255,255,255,0.08);--border2:rgba(0,255,136,0.3);--glass:rgba(255,255,255,0.03);--glass2:rgba(255,255,255,0.06);--glow-green:0 0 20px rgba(0,255,136,0.4);--glow-cyan:0 0 20px rgba(0,212,255,0.4);--radius:12px;--radius-sm:8px;--transition:0.2s ease} *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} html{scroll-behavior:smooth} body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden} a{color:inherit;text-decoration:none} button{cursor:pointer;font-family:'Inter',sans-serif} input,select,textarea{font-family:'Inter',sans-serif} ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-track{background:var(--bg2)} ::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px} ::-webkit-scrollbar-thumb:hover{background:var(--green)} #main-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 24px;gap:16px} .nav-logo{font-family:'Press Start 2P',monospace;font-size:14px;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap} .nav-links{display:flex;gap:4px;margin-left:24px;flex:1} .nav-link{padding:8px 14px;border-radius:var(--radius-sm);color:var(--text2);font-size:14px;font-weight:500;transition:var(--transition)} .nav-link:hover,.nav-link.active{color:var(--text);background:var(--glass2)} .nav-right{display:flex;gap:8px;align-items:center;margin-left:auto} .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:none;transition:var(--transition);white-space:nowrap} .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)} .btn-ghost:hover{color:var(--text);border-color:var(--border2)} .btn-primary{background:linear-gradient(135deg,var(--green),var(--cyan));color:#000;box-shadow:var(--glow-green)} .btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(0,255,136,0.6)} .btn-sm{padding:7px 14px;font-size:13px} .btn-danger{background:rgba(255,68,68,0.15);color:var(--red);border:1px solid rgba(255,68,68,0.3)} .btn-danger:hover{background:rgba(255,68,68,0.25)} .btn-outline{background:transparent;color:var(--green);border:1px solid var(--border2)} .btn-outline:hover{background:rgba(0,255,136,0.08)} #toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px} .toast{padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;backdrop-filter:blur(20px);border:1px solid var(--border);animation:slideIn .3s ease;max-width:320px} .toast-success{background:rgba(0,255,136,0.15);border-color:rgba(0,255,136,0.4);color:var(--green)} .toast-error{background:rgba(255,68,68,0.15);border-color:rgba(255,68,68,0.4);color:var(--red)} .toast-info{background:rgba(0,212,255,0.15);border-color:rgba(0,212,255,0.4);color:var(--cyan)} @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}} #app{padding-top:64px;min-height:100vh} .page{display:none} .page.active{display:block} </style> </head> <body> <nav id="main-nav"> <span class="nav-logo">⚒ FreeForge</span> <div class="nav-links"> <a class="nav-link" href="#" onclick="showPage('home');return false">Home</a> <a class="nav-link" href="#" onclick="showPage('home');scrollToFeatures();return false">Features</a> <a class="nav-link" href="#" onclick="showPage('home');scrollToPricing();return false">Pricing</a> </div> <div class="nav-right" id="nav-right"> <button class="btn btn-ghost btn-sm" onclick="showPage('login')">Log In</button> <button class="btn btn-primary btn-sm" onclick="showPage('signup')">Sign Up Free</button> </div> </nav> <div id="toast-container"></div> <div id="app"> <div class="page active" id="page-home"></div> <div class="page" id="page-login"></div> <div class="page" id="page-signup"></div> <div class="page" id="page-dashboard"></div> <div class="page" id="page-profile"></div> <div class="page" id="page-server"></div> </div> <div id="wizard-overlay" style="display:none"></div> <script> let currentUser=null,currentPage='home',wizardStep=1,wizardData={},activeServerId=null,activeTab='overview',consoleInterval=null; function hashPass(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return'ff'+Math.abs(h).toString(16);} function getUsers(){return JSON.parse(localStorage.getItem('ff_users')||'{}');} function saveUsers(u){localStorage.setItem('ff_users',JSON.stringify(u));} function getSession(){return JSON.parse(localStorage.getItem('ff_session')||'null');} function saveSession(u){localStorage.setItem('ff_session',JSON.stringify(u));} function clearSession(){localStorage.removeItem('ff_session');} function getServers(uid){return JSON.parse(localStorage.getItem('ff_servers_'+uid)||'[]');} function saveServers(uid,s){localStorage.setItem('ff_servers_'+uid,JSON.stringify(s));} function genId(){return Math.random().toString(36).slice(2,10);} function toast(msg,type='info'){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),3500);} function getMinehutToken(){return localStorage.getItem('ff_mh_token');} function getMinehutSession(){return localStorage.getItem('ff_mh_session');} function saveMinehutAuth(token,session){localStorage.setItem('ff_mh_token',token);localStorage.setItem('ff_mh_session',session);} function clearMinehutAuth(){localStorage.removeItem('ff_mh_token');localStorage.removeItem('ff_mh_session');} async function minehutLogin(email,password){ const res=await fetch('https://api.minehut.com/users/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}); const data=await res.json(); if(!res.ok)throw new Error(data.error||'Login failed'); return data; } async function minehutCreateServer(name){ const token=getMinehutToken(); const res=await fetch('https://api.minehut.com/servers/create',{method:'POST',headers:{'Content-Type':'application/json','Authorization':token},body:JSON.stringify({name,platform:'java'})}); const data=await res.json(); if(!res.ok)throw new Error(data.error||'Failed to create server'); return data; } async function wizConnectMinehut(){ const email=document.getElementById('mh-email').value.trim(); const pass=document.getElementById('mh-pass').value; if(!email||!pass){toast('Please enter your Minehut credentials','error');return;} const btn=document.getElementById('mh-login-btn'); btn.textContent='Connecting...';btn.disabled=true; try{ const data=await minehutLogin(email,pass); saveMinehutAuth(data.token,data.sessionId||data._id); toast('Minehut connected! ✅','success'); renderWizardStep(); }catch(e){ toast(e.message||'Login failed. Check your credentials.','error'); btn.textContent='Connect Minehut Account';btn.disabled=false; } } async function wizCreateMinehutServer(){ const btn=document.getElementById('create-btn'); btn.textContent='Creating...';btn.disabled=true; try{ const serverName=wizardData.name.replace(/[^a-zA-Z0-9]/g,'-').toLowerCase().slice(0,10); const data=await minehutCreateServer(serverName); const ip=data.server?.name?`${data.server.name}.minehut.gg`:'pending...'; createServerRecord(ip,data.server?._id||''); }catch(e){ toast(e.message||'Failed to create server. Try again.','error'); btn.textContent='⚡ Create My Server';btn.disabled=false; } } function initSession(){const s=getSession();if(s){const users=getUsers();if(users[s.email]){currentUser=users[s.email];updateNav();}}} function updateNav(){ const nr=document.getElementById('nav-right'); if(currentUser){nr.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="showPage('dashboard')">Dashboard</button><div onclick="showPage('profile')" style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#000;cursor:pointer">${currentUser.username.slice(0,2).toUpperCase()}</div>`;} else{nr.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="showPage('login')">Log In</button><button class="btn btn-primary btn-sm" onclick="showPage('signup')">Sign Up Free</button>`;} } function showPage(name){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); const pg=document.getElementById('page-'+name);if(!pg)return; pg.classList.add('active');currentPage=name; if(consoleInterval){clearInterval(consoleInterval);consoleInterval=null;} if(name==='home')renderHome(); else if(name==='login')renderLogin(); else if(name==='signup')renderSignup(); else if(name==='dashboard'){if(!requireAuth())return;renderDashboard();} else if(name==='profile'){if(!requireAuth())return;renderProfile();} else if(name==='server'){if(!requireAuth())return;renderServerPage();} window.scrollTo(0,0); } function scrollToFeatures(){setTimeout(()=>{const el=document.getElementById('features-section');if(el)el.scrollIntoView({behavior:'smooth'});},100);} function scrollToPricing(){setTimeout(()=>{const el=document.getElementById('pricing-section');if(el)el.scrollIntoView({behavior:'smooth'});},100);} function requireAuth(){if(!currentUser){toast('Please log in first','error');showPage('login');return false;}return true;} function doSignup(e){ e.preventDefault(); const username=document.getElementById('su-username').value.trim(); const email=document.getElementById('su-email').value.trim().toLowerCase(); const pass=document.getElementById('su-pass').value; if(!username||!email||!pass){toast('Please fill all fields','error');return;} if(pass.length<6){toast('Password must be 6+ characters','error');return;} const users=getUsers(); if(users[email]){toast('Email already registered','error');return;} const user={username,email,password:hashPass(pass),joinDate:new Date().toISOString(),id:genId()}; users[email]=user;saveUsers(users);currentUser=user;saveSession(user);updateNav(); toast('Welcome to FreeForge, '+username+'! 🎉','success');showPage('dashboard'); } function doLogin(e){ e.preventDefault(); const email=document.getElementById('li-email').value.trim().toLowerCase(); const pass=document.getElementById('li-pass').value; const users=getUsers();const user=users[email]; if(!user||user.password!==hashPass(pass)){toast('Invalid email or password','error');return;} currentUser=user;saveSession(user);updateNav();toast('Welcome back, '+user.username+'! 👋','success');showPage('dashboard'); } function doLogout(){currentUser=null;clearSession();updateNav();toast('Logged out','info');showPage('home');} function initParticles(){ const canvas=document.getElementById('particles-canvas');if(!canvas)return; const ctx=canvas.getContext('2d');let W,H,particles=[]; function resize(){W=canvas.width=canvas.offsetWidth;H=canvas.height=canvas.offsetHeight;} resize();window.addEventListener('resize',resize); for(let i=0;i<80;i++)particles.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.5,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,a:Math.random()}); function draw(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=0.005;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,255,136,${0.3+0.2*Math.sin(p.a)})`;ctx.fill();});requestAnimationFrame(draw);} draw(); } function renderHome(){ document.getElementById('page-home').innerHTML=`<style> #hero{position:relative;min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,255,136,0.08) 0%,transparent 70%)} .hero-content{position:relative;z-index:1;max-width:800px;padding:40px 24px} .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);font-size:12px;color:var(--green);margin-bottom:24px} .hero-title{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4vw,40px);line-height:1.5;background:linear-gradient(135deg,#fff 0%,var(--green) 50%,var(--cyan) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:20px} .hero-sub{font-size:18px;color:var(--text2);max-width:560px;margin:0 auto 36px;line-height:1.7} .hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:48px} .hero-stats{display:flex;gap:32px;justify-content:center;flex-wrap:wrap} .stat{text-align:center}.stat-num{font-family:'Press Start 2P',monospace;font-size:18px;color:var(--green)}.stat-label{font-size:12px;color:var(--text3);margin-top:4px} .h-section{padding:80px 24px;max-width:1100px;margin:0 auto} .section-title{font-family:'Press Start 2P',monospace;font-size:clamp(13px,2.5vw,20px);text-align:center;margin-bottom:12px;background:linear-gradient(135deg,var(--text),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text} .section-sub{text-align:center;color:var(--text2);font-size:15px;margin-bottom:48px} .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px} .feat-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:var(--transition)} .feat-card:hover{border-color:var(--border2);background:var(--glass2);transform:translateY(-3px)} .feat-icon{font-size:32px;margin-bottom:16px}.feat-title{font-weight:700;font-size:15px;margin-bottom:8px}.feat-desc{font-size:13px;color:var(--text2);line-height:1.6} .pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:700px;margin:0 auto} .price-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;position:relative} .price-card.featured{border-color:var(--border2);background:rgba(0,255,136,0.04);box-shadow:var(--glow-green)} .price-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--green),var(--cyan));color:#000;font-size:11px;font-weight:700;padding:4px 14px;border-radius:999px} .price-name{font-family:'Press Start 2P',monospace;font-size:13px;margin-bottom:16px} .price-amount{font-size:42px;font-weight:800;margin-bottom:4px}.price-amount span{font-size:16px;color:var(--text2)} .price-period{font-size:13px;color:var(--text3);margin-bottom:24px} .price-features{list-style:none;text-align:left;margin-bottom:28px} .price-features li{font-size:13px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px} .price-features li::before{content:'✓';color:var(--green);font-weight:700} .testimonials-
